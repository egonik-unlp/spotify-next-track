# Domain configuration — Spotify engagement-from-metadata models.
#
# Sibling of lensing-spotify, but a different question: can a track's INTRINSIC
# metadata (genre, artist, popularity, release year, …) alone predict how much
# the user will engage with it? Target: engagement = play_count ×
# completion_ratio, log1p-transformed (the same playback signal lensing-spotify
# uses) — but here the features are restricted to descriptive song metadata.
#
# Corpus: the user's personal listening history (one point per unique track),
# 12,256 tracks. Vectors are 200-dim word2vec co-listening embeddings — a
# BEHAVIORAL signal, NOT song metadata — so the payload-based predictors are
# the canonical models here and the embedding is left out of the feature set.
# Because we do not depend on the co-listening vector, we keep ALL tracks (no
# `embedding_source=="learned"` filter): the metadata fields are present for
# fallback-vector tracks too, giving ~4× the rows lensing-spotify trains on.
#
# Rules of the road:
# - Field order is load-bearing: feature columns are emitted numerics-first
#   then categoricals, each in the order declared here.
# - Field `name`s are payload JSON keys AND the items.json keys predictors
#   read.
# - Quality rule keys are stable internal identifiers; we rebind/relabel
#   them, we do not rename them.
#
# NOTE on leakage: play_count / completion_ratio / skip_rate / shuffle_rate /
# distinct_sessions are playback signals (engagement is built from the first
# two). Curation fields (is_saved / in_playlist_count / on_repeat_count) are
# behavioral too — you save/replay what you already engage with. ALL of these
# are default_on = false so the canonical "metadata-only" build predicts
# engagement from intrinsic song attributes alone; turning a group back on is a
# deliberate sanity / soft-leakage control build, never the default.

schema_version = 1

[project]
name = "spotify-next-track"
title = "Spotify Next-Track (session recommendation)"
entity_noun = "track"
entity_noun_plural = "tracks"
target_noun = "next track"

[branding]
mark_seed = "spotify-engagement"
# Rotates the velocity ramp so the swarm reads green (approaching side lands on
# the brand accent hue ~150) ↔ violet (receding) — matching the instance's
# green-signal / violet-detail palette instead of stock lensing's red/blue.
mark_hue_shift = 265

[corpus]
# Instance-local Qdrant on 6337 (own container spotify-nexttrack-qdrant).
qdrant_url = "http://localhost:6337"
collection = "spotify_tracks"
manual_collection = "manual-tracks"
embedding_dim = 200
metadata_root = "metadata"
content_field = "content"

# No corpus filter: engagement is predicted from intrinsic song metadata, which
# every track carries, so the embedding_source ("learned" vs "fallback")
# distinction that gates lensing-spotify is irrelevant here. Use all 12,256
# tracks. (must/must_not empty ⇒ Qdrant match-all.)
[corpus.filter]
desc = "all tracks (metadata is present regardless of embedding source)"
must = []
must_not = []

# NEXT-TRACK PIVOT (2026-07-12): this instance predicts, within a listening
# session, WHICH TRACK the user plays next — a sequence / next-item retrieval
# task, not a per-track scalar. The model consumes the ordered session prefix
# and predicts the next track's 64-dim song-AE latent, retrieved by cosine over
# the corpus. Ranked by Recall@k / MRR / hit-rate on a leak-free session split.
# The scalar [target] below is a semantic placeholder (the real label is the
# next sequence item); validation uses [sequence], not a role="target" field.
[target]
field = "next_track"
transform = "none"
task = "ranking"

[target.format]
style = "number"
symbol = ""
locale = "en-US"

# Sequence / next-item configuration. Sessions + order come from the OFFLINE
# play stream (pipeline/corpus/sequences.py over sessions.parquet), not the
# per-track Qdrant payload. Latents come from the song-AE collection.
[sequence]
session_field = "session_id"
order_field = "ts"
gap_minutes = 30
skip_threshold_ms = 30000
label = "last_item"
latent_source = "spotify_tracks_song_ae"
# Graded-relevance fields: the eval (predictors/seq_common.py) ALSO credits a
# candidate that shares the truth's artist/genre even when the exact track is
# wrong (artist@k / genre@k / artist_mrr). These are the items.json metadata
# keys the eval reads; the module reads the artifact (not this config) so it
# hardcodes "artist"/"genre" — this line documents that binding, keep in sync.
# "album" additionally drives album_adj@10 (keyed by the (artist,album) tuple);
# it is emitted into items.json by pipeline/corpus/sequences.py and only
# populates on datasets rebuilt after that emitter landed (older datasets omit
# album_adj@10 gracefully).
relevance_fields = ["artist", "genre", "album"]

[metrics]
# CROWN = holisticness (2026-07-23; GROUNDED 2026-07-25): the goal is
# mood-coherent, non-eager SESSIONS, not guessing the literal next track. The
# primary is a COMPOSITE, computed in seq_common.py::eval_from_scores:
#
#   holisticness@10 = clamp(mood_coh,0) × ild × (1−eager) × music_rel
#   where eager     = max(artist_adj, artist_conc)
#         music_rel = clamp((music@10 − 0.34) / (1 − 0.34), 0, 1)
#
# REVISED 2026-07-26 (second revision; see seq_common.py for the derivations):
#   * `eager` is now the WORSE of seed-echo (artist_adj) and within-list
#     concentration (artist_conc, normalized Herfindahl over the top-k artists).
#     artist_adj alone was blind to a top-k made of ten tracks by one NON-seed
#     artist: `mood-session` scored artist_adj 0.0036 at artist_conc 0.3291.
#   * the grounding floor rose 0.185 → 0.34, from the context-free popularity
#     score to just above the MOOD-ONLY baseline (`mood-session`'s music@10 =
#     0.3384). Mood coherence is already paid for by mood_coh and ild, so a floor
#     below mood-only let the composite double-count mood; at 0.185 the
#     degenerate `cummean/cummean` arm led the crown at recall@10 0.066.
#   Under the revision: C0 single-GRU 0.0245 leads, degenerate arm 0.0141,
#   champion blend 0.0048 (correctly low — artist_conc 0.69), mood-only 0.0000.
#
# DISCRIMINATION (measured 2026-07-26, 8 architecture arms, n=1431): the crown's
# paired-bootstrap CI half-width is ~0.0018, so it resolves a Δ of 0.005 with only
# ~181 test sessions — it is a PRECISE instrument. But the architecture family's
# whole H spread is 0.003, i.e. 1.8 CI half-widths, so 7 of 8 adjacent arms are
# unresolvable. Read: use holisticness to compare POLICIES and FAMILIES (an MMR
# re-rank moves ild by ~0.11, ~30× the noise floor), not to rank near-identical
# architectures. recall@10 is no better there — 2.3 half-widths, 2 of 8 resolvable.
#
# — coherent AND varied AND non-eager AND actually related to what the user
# played next. The 4th factor was added 2026-07-25 because the original
# 3-factor crown was gameable: all three of its facets are INTERNAL to the
# returned list (top-10 vs the prefix mood centroid, and vs itself), so nothing
# in it rewarded being right. Measured consequence — the 3-factor crown ranked
# `seq-mood` first at holisticness 0.233 on recall@10 0.024 (34 correct
# next-tracks of 1431) and music@10 0.338, with the whole ranking running
# near-perfectly ANTI-correlated with music@10: it was maximized by serving
# pleasant unrelated music. The grounding factor is music@10 (continuous
# sounds-alike relevance, NOT exact recall — it credits landing something that
# merely sounds like the true continuation), rescaled above a floor so it has
# enough spread to bind; the raw product does NOT fix the failure mode (verified:
# it still ranks `seq-mood` first). That floor was 0.185 on 2026-07-25 and is now
# 0.34 — see the REVISED note above, which supersedes this paragraph.
# recall@10 stays a displayed column (no longer load-bearing as a floor — the
# music_rel factor now carries relevance inside the crown itself).
# Reversible: set primary back to "recall@10" to restore the next-track crown.
# ⚠ Stored holisticness@10 from runs BEFORE 2026-07-25 is the 3-factor value and
# is NOT comparable; recompute from the stored facets across that cut.
primary = "holisticness@10"
# music@10 — continuous "sounds-alike" graded relevance: mean best cosine, in the
# balanced intrinsic musical-distance space (spotify_tracks_content_metric, built
# by pipeline/build_content_metric.py), between the true next track and the top-10
# candidates. Credits landing something musically close on an exact/artist/genre
# miss; a smooth superset of recall@10. 0..1, higher-better. Display-only (primary
# stays recall@10).
#
# Session-holisticness diagnostics (all display-only; primary stays recall@10),
# computed in predictors/seq_common.py::eval_from_scores. They quantify the
# "predictions are too album-eager" symptom so it can be seen on the leaderboard:
#   artist_adj@10 / album_adj@10 — share of the top-10 that just parrots the
#     SEED's artist / album (LOWER better; the eagerness rate). album_adj@10 only
#     populates on datasets whose items.json carries "album".
#   mood_coh@10 — top-10 cosine to the prefix mood centroid in the content-metric
#     space (higher = stays in the sonic neighborhood).
#   ild@10 — intra-list diversity of the top-10 (higher = less duplicative).
# NOT leaderboard columns (a run's eval never produces them): suffix_recall@10 /
# cont_prec@10 are multi-step continuation metrics from the on-demand harness
# predictors/seq_continuation_eval.py (leave-last-m-out) — they're reported in
# campaign write-ups, not per-run, so they're intentionally left out of `columns`
# (their Metrics fields still exist for the harness / reports).
columns = [
    "holisticness@10", "mood_coh@10", "ild@10", "artist_adj@10", "artist_conc@10", "album_adj@10",
    "recall@10", "artist@10", "genre@10", "music@10", "mrr", "hit@10",
]
percent = []
value_unit = "P(next-track hit)"
best_models_size = 12
# Ranking-direction overrides: the adjacency rates are LOWER-better (a lower
# share of same-artist/same-album top-k = less eager). All other holisticness
# metrics are higher-better (the built-in default).
[metrics.directions]
"artist_adj@10" = true
"artist_conc@10" = true
"album_adj@10" = true

# ---- Fields: the corpus payload schema ----

[[fields]]
name = "rotation"
role = "target"

# Old target, demoted to a documented non-target field (target-derived, so it
# stays OFF as a feature — using it would leak).
[[fields]]
name = "engagement"
label = "engagement (former target)"
role = "numeric"
encode = "log1p"
default_on = false
group = "playback"

[[fields]]
name = "embedding_source"
role = "filter_only"

# --- Playback signals: components of / proxies for the target. Features only
#     for a deliberate sanity-ceiling build; OFF by default. ---

[[fields]]
name = "play_count"
label = "play count"
role = "numeric"
encode = "log1p"
default_on = false
group = "playback"

[[fields]]
name = "completion_ratio"
label = "completion"
role = "numeric"
encode = "raw"
default_on = false
group = "playback"

[[fields]]
name = "skip_rate"
label = "skip rate"
role = "numeric"
encode = "raw"
default_on = false
group = "playback"

[[fields]]
name = "shuffle_rate"
label = "shuffle rate"
role = "numeric"
encode = "raw"
default_on = false
group = "playback"

[[fields]]
name = "distinct_sessions"
label = "distinct sessions"
role = "numeric"
encode = "log1p"
default_on = false
group = "playback"

# --- Intrinsic song metadata: the canonical feature set (default ON). ---

[[fields]]
name = "artist_popularity"
label = "artist popularity"
role = "numeric"
encode = "raw"
indicator = true
default_on = true

[[fields]]
name = "track_popularity"
label = "track popularity"
role = "numeric"
encode = "raw"
indicator = true
default_on = true

[[fields]]
name = "artist_followers"
label = "artist followers"
role = "numeric"
encode = "log1p"
default_on = true

[[fields]]
name = "release_year"
label = "release year"
role = "numeric"
encode = "raw"
default_on = true

[[fields]]
name = "artist_count"
label = "credited artists"
role = "numeric"
encode = "raw"
default_on = true

# --- Acoustic features (af_*): what the track SOUNDS like, fetched from
#     ReccoBeats (a non-Spotify drop-in for the deprecated Spotify
#     audio-features endpoint) keyed by track_uri; see pipeline/. INTRINSIC and
#     orthogonal to artist/genre identity; 64.8% coverage (indicator=true flags
#     misses). TESTED 2026-06-08 and default_on = false: on an identical split
#     they made xgboost slightly WORSE (MAE 2.684→2.775), so the canonical build
#     stays the one-hot baseline. Kept available for experiments / a noise-band
#     re-test. See experiments/PROJECT-FACTS.md. ---

[[fields]]
name = "af_danceability"
label = "danceability"
role = "numeric"
encode = "raw"
indicator = true
default_on = false
group = "audio"

[[fields]]
name = "af_energy"
label = "energy"
role = "numeric"
encode = "raw"
indicator = true
default_on = false
group = "audio"

[[fields]]
name = "af_valence"
label = "valence"
role = "numeric"
encode = "raw"
indicator = true
default_on = false
group = "audio"

[[fields]]
name = "af_acousticness"
label = "acousticness"
role = "numeric"
encode = "raw"
indicator = true
default_on = false
group = "audio"

[[fields]]
name = "af_instrumentalness"
label = "instrumentalness"
role = "numeric"
encode = "raw"
indicator = true
default_on = false
group = "audio"

[[fields]]
name = "af_speechiness"
label = "speechiness"
role = "numeric"
encode = "raw"
indicator = true
default_on = false
group = "audio"

[[fields]]
name = "af_liveness"
label = "liveness"
role = "numeric"
encode = "raw"
indicator = true
default_on = false
group = "audio"

[[fields]]
name = "af_loudness"
label = "loudness (dB)"
role = "numeric"
encode = "raw"
indicator = true
default_on = false
group = "audio"

[[fields]]
name = "af_tempo"
label = "tempo (BPM)"
role = "numeric"
encode = "raw"
indicator = true
default_on = false
group = "audio"

[[fields]]
name = "af_key"
label = "key (pitch class)"
role = "numeric"
encode = "raw"
indicator = true
default_on = false
group = "audio"

[[fields]]
name = "af_mode"
label = "mode (maj/min)"
role = "numeric"
encode = "raw"
indicator = true
default_on = false
group = "audio"

# --- Curation signals: library/playlist behavior. Not playback, but
#     behaviorally entangled with engagement (soft leakage); OFF by default. ---

[[fields]]
name = "is_saved"
label = "saved to library"
role = "numeric"
encode = "raw"
indicator = true
default_on = false
group = "curation"

[[fields]]
name = "in_playlist_count"
label = "playlist memberships"
role = "numeric"
encode = "raw"
default_on = false
group = "curation"

[[fields]]
name = "on_repeat_count"
label = "on-repeat snapshots"
role = "numeric"
encode = "raw"
default_on = false
group = "curation"

[[fields]]
name = "first_played"
label = "first played"
role = "timestamp"

[[fields]]
name = "genre_primary"
label = "primary genre"
role = "categorical"
vocab = { top_n = 40 }
critical = true
default_on = true

[[fields]]
name = "artist"
role = "categorical"
vocab = { top_n = 60 }
default_on = true

[[fields]]
name = "album_type"
label = "release type"
role = "categorical"
vocab = "all"
default_on = true

[[fields]]
name = "top_platform"
label = "top platform"
role = "categorical"
vocab = "all"
default_on = false
group = "playback"

[[fields]]
name = "track_name"
label = "track"
role = "display"

[[fields]]
name = "album"
role = "display"

[[fields]]
name = "track_uri"
label = "spotify URI"
role = "display"

# No [coordinates] (no geo fields) and no [currency] (single-"currency"
# domain) — sections omitted entirely.

[quality]
outlier_group = "genre_primary"

[agents]
# 8095 is taken by lensing-spotify; this instance lives on 8096.
api_base_url = "http://localhost:8096"
report_dir = "experiments"
facts_file = "experiments/PROJECT-FACTS.md"
definition_naming = "<predictor>-<slug>"
definition_naming_example = "xgboost-metadata-only"
# Personal listening corpus — no web-scrape ingestion story.
ingestion = false

[quality.rule_labels]
"nonpositive-price" = "engagement ≤ 0"
"price-outlier" = "engagement outlier"
"missing-fields" = "missing fields"
"price-range" = "engagement out of range"
"bedrooms-outlier" = "capped-numeric outlier"
"duplicate-content" = "duplicate track"
"short-content" = "thin description"
# This domain has no currency; the rule is unbound and never fires.
"foreign-currency" = "(n/a — no currency)"
