# spotify-next-track — full docker-hosted deployment (server + UI + Postgres + Qdrant).
#
# Follows the /srv/shared/docker/<service>/ pattern (snappler tailnet): one
# published port, reverse-proxied by the Caddy router at http://nexttrack.snappler.
#
#   docker compose build        # build the server image from the repo (context = ..)
#   docker compose up -d         # start the stack (auto-restarts on boot)
#   docker compose push          # publish the image to ghcr (optional)
#
# .env (next to this file) supplies DB creds + Spotify/OpenAI keys — see .env.example.
#
# STATE: postgres, qdrant and data/ start EMPTY. A fresh deploy must restore the
# instance bundle (Postgres dump + Qdrant snapshot + data/) — see deploy/README.md
# "Restoring instance state". Only the model DEFINITIONS + config are baked in.
name: spotify-nexttrack

services:
  postgres:
    image: postgres:16-alpine
    container_name: spotify-nexttrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LENSING_DB_USER:-pg}
      POSTGRES_PASSWORD: ${LENSING_DB_PASSWORD:-pg}
      POSTGRES_DB: ${LENSING_DB_NAME:-lensing}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LENSING_DB_USER:-pg} -d ${LENSING_DB_NAME:-lensing}"]
      interval: 3s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:latest
    container_name: spotify-nexttrack-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  lensing-server:
    image: ghcr.io/egonik-unlp/spotify-nexttrack:latest
    build:
      context: ..                    # repo root
      dockerfile: deploy/Dockerfile
    container_name: spotify-nexttrack-server
    restart: unless-stopped
    environment:
      LENSING_PORT: 8096
      LENSING_QDRANT_URL: http://qdrant:6333
      LENSING_COLLECTION: ${LENSING_COLLECTION:-spotify_tracks}
      LENSING_DATABASE_URL: postgres://${LENSING_DB_USER:-pg}:${LENSING_DB_PASSWORD:-pg}@postgres:5432/${LENSING_DB_NAME:-lensing}
      # Optional: corpus refresh (Spotify Web API) + content embed (OpenAI).
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      # Published for the Caddy router (http://nexttrack.snappler -> localhost:8096).
      - "${LENSING_PORT:-8096}:8096"
    volumes:
      - lensing_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/api/runs"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
  qdrant_storage:
  lensing_data:
