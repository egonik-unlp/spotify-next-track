[[predictors]]
name = "ridge"
display_name = "Ridge (scikit-learn)"
language = "Python"
framework = "scikit-learn"
description = "L2-regularized linear regression on PCA embeddings + metadata one-hots, adapted to this corpus: CV-selected alpha, optional target-proportional sample weights against tail compression bias, optional Huber loss. Python, CPU."
command = "predictors/.venv/bin/python"
args = ["predictors/ridge/ridge.py", "train", "--dataset", "{dataset}", "--output", "{run_dir}", "--hyperparams", "{hyperparams}"]
predict_args = ["predictors/ridge/ridge.py", "predict", "--model", "{model}", "--input", "{input}", "--output", "{output}"]
export_args = ["predictors/ridge/ridge.py", "export", "--model", "{model}", "--output", "{output}"]

[[predictors.params]]
name = "auto_alpha"
label = "select alpha by CV"
type = "bool"
default = true

[[predictors.params]]
name = "alpha"
label = "regularization strength (when CV off)"
type = "float"
default = 1.0
min = 0.0
max = 100000.0

[[predictors.params]]
name = "weight_gamma"
label = "target weight exponent"
type = "float"
default = 0.0
min = 0.0
max = 2.0

[[predictors.params]]
name = "loss"
label = "loss"
type = "enum"
default = "squared"
options = ["squared", "huber"]

[[predictors.params]]
name = "huber_epsilon"
label = "huber epsilon"
type = "float"
default = 1.35
min = 1.0
max = 5.0

