[package]
name = "lensing-intake"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Config-driven intake pipeline: data origins -> embeddings -> Qdrant + Postgres, built on the lvv crate"

[dependencies]
# The reusable pipeline library (Source/Sink traits, connectors, JobQueue,
# embed_texts, embedding Cache, LLM transforms). 0.6 embeds text as given
# (0.5 wrapped it in JSON quotes) and has typed errors.
lvv = { version = "0.6.0", features = ["postgres", "sql", "http"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "lensing-intake"
path = "src/main.rs"
