# Infrastructure for a lensing instance.
#
#   docker compose --profile qdrant up -d postgres qdrant --wait   (zig build db-up)
#       metadata database (Postgres) + the local Qdrant corpus.
#
# This instance hosts its OWN Qdrant on :6335 (the `qdrant` profile); it does
# NOT depend on any sibling/external Qdrant. The qdrant_storage volume starts
# empty on a fresh checkout — load the corpus with a Qdrant snapshot restore
# or pipeline/refresh_corpus.sh before serving.
#
# Postgres holds the server's metadata/parameter state (model definitions,
# run metas + metrics, promoted-model records, dataset index, hp presets).
# Binary artifacts (features.f32, model weights, …) stay under data/.
# Host port 5433 avoids colliding with a system Postgres on 5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: spotify-nexttrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LENSING_DB_USER:-pg}
      POSTGRES_PASSWORD: ${LENSING_DB_PASSWORD:-pg}
      POSTGRES_DB: ${LENSING_DB_NAME:-lensing}
    ports:
      # 5433/5434/5435 are taken by other lensing instances (incl. the sibling
      # lensing-spotify on 5435); 5436 is used by the sibling
      # spotify-predict-engagement, so this instance uses 5437.
      - "${LENSING_DB_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LENSING_DB_USER:-pg} -d ${LENSING_DB_NAME:-lensing}"]
      interval: 2s
      timeout: 3s
      retries: 15

  qdrant:
    image: qdrant/qdrant:latest
    container_name: spotify-nexttrack-qdrant
    restart: unless-stopped
    profiles: ["qdrant"]
    ports:
      # 6333/6334 are taken by agent-realstate's Qdrant; 6335/6336 by the
      # sibling spotify-predict-engagement, so this instance uses 6337/6338.
      - "6337:6333"
      - "6338:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  pgdata:
  qdrant_storage:
