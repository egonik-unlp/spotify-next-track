name = "infinite-playlist"
main = "worker/index.ts"
compatibility_date = "2026-06-10"

[observability]
enabled = true

# Static app + baked model assets (gru.onnx, latents.i16, catalog.json,
# manifest.json, projector.bin) live under public/ and are served directly.
[assets]
directory = "./public"
binding = "ASSETS"

# Workers AI — bge-m3 text embedding for cold-start of arbitrary seed tracks.
[ai]
binding = "AI"

# Bundle the Rust→WASM core as a CompiledWasm module (imported in worker/index.ts).
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

# Spotify credentials are secrets, NOT vars:
#   wrangler secret put SPOTIFY_CLIENT_ID
#   wrangler secret put SPOTIFY_CLIENT_SECRET
# For local `wrangler dev`, put them in .dev.vars (gitignored).
#
# Optional override of the embedding model (must match the baked projector):
# [vars]
# EMBED_MODEL = "@cf/baai/bge-m3"
